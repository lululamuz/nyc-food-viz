<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Does NYC Eat?</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>What Does<br>NYC Eat?</h1>
    <p>The 10 most common restaurant cuisines in each New York City borough.</p>
  </header>

  <main>
    <div class="controls">
      <select id="borough"></select>
      <div class="toggle">
        <button data-type="doughnut" class="active">Doughnut</button>
        <button data-type="bar">Bar</button>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="cuisineChart"></canvas>
    </div>

    <p id="insight" class="insight"></p>
  </main>

  <footer>
    Data: <a href="https://data.cityofnewyork.us/Health/NYCFoodInspectionSimple/sfd3-axrg" target="_blank">NYC Open Data — NYCFoodInspectionSimple</a>, Oct 2026.
    Each restaurant counted once. Built with Chart.js.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
